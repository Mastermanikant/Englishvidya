<script>
        document.addEventListener('DOMContentLoaded', () => {
            const flashcard = document.getElementById('flashcard');
            const flashcardInner = document.getElementById('flashcard-inner');
            const actionButtons = document.getElementById('action-buttons');
            let isFlipped = false;

            flashcard.addEventListener('click', () => {
                if (!isFlipped) {
                    flashcardInner.style.transform = 'rotateY(180deg)';
                    actionButtons.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
                    actionButtons.classList.add('opacity-100', 'translate-y-0');
                    isFlipped = true;
                }
            });

            // Prevent flip when clicking action buttons
            actionButtons.addEventListener('click', (e) => {
                e.stopPropagation();
                // In a real app, this would trigger the next card logic
                // For demo, we just reset the flip
                flashcardInner.style.transform = 'rotateY(0deg)';
                actionButtons.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
                actionButtons.classList.remove('opacity-100', 'translate-y-0');
                isFlipped = false;
            });
            
            // Add subtle tilt effect to flashcard on mousemove (desktop only)
            if (window.matchMedia("(min-width: 768px)").matches) {
                flashcard.addEventListener('mousemove', (e) => {
                    if (isFlipped) return;
                    const rect = flashcard.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;
                    
                    const rotateX = ((y - centerY) / centerY) * -5;
                    const rotateY = ((x - centerX) / centerX) * 5;
                    
                    flashcardInner.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
                });
                
                flashcard.addEventListener('mouseleave', () => {
                    if (!isFlipped) {
                        flashcardInner.style.transform = 'rotateX(0) rotateY(0)';
                    }
                });
            }
        });
    </script>
